<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 340px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #faf9f7;
        color: #1a1a1a;
        padding: 20px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e5e2dc;
      }
      .header h1 {
        font-size: 16px;
        font-weight: 700;
        color: #c4704b;
      }
      .header svg {
        width: 28px;
        height: 28px;
        color: #c4704b;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #666;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 12px;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus {
        border-color: #c4704b;
      }
      .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-primary {
        background: linear-gradient(135deg, #c4704b 0%, #a85d3a 100%);
        color: white;
      }
      .btn-cart {
        background: linear-gradient(135deg, #0071dc 0%, #004c91 100%);
        color: white;
        margin-top: 8px;
      }
      .status {
        margin-top: 10px;
        padding: 8px;
        border-radius: 6px;
        font-size: 12px;
        text-align: center;
        display: none;
      }
      .status.success {
        display: block;
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        display: block;
        background: #f8d7da;
        color: #721c24;
      }
      .help {
        margin-top: 12px;
        font-size: 11px;
        color: #999;
        line-height: 1.5;
      }
      .divider {
        height: 1px;
        background: #e5e2dc;
        margin: 16px 0;
      }
      .section-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .section-title svg {
        width: 16px;
        height: 16px;
      }
      .progress-bar {
        width: 100%;
        height: 6px;
        background: #e5e2dc;
        border-radius: 3px;
        margin: 8px 0;
        overflow: hidden;
        display: none;
      }
      .progress-bar.active {
        display: block;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #0071dc, #004c91);
        border-radius: 3px;
        transition: width 0.3s ease;
        width: 0%;
      }
      .progress-text {
        font-size: 12px;
        color: #666;
        text-align: center;
        display: none;
      }
      .progress-text.active {
        display: block;
      }
      .results {
        margin-top: 8px;
        font-size: 12px;
        display: none;
      }
      .results.active {
        display: block;
      }
      .results .stat {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        margin: 2px;
        font-weight: 600;
      }
      .stat-added {
        background: #d4edda;
        color: #155724;
      }
      .stat-failed {
        background: #f8d7da;
        color: #721c24;
      }
      .stat-backup {
        background: #fff3cd;
        color: #856404;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z" />
        <path d="m3 9 2.45-4.9A2 2 0 0 1 7.24 3h9.52a2 2 0 0 1 1.8 1.1L21 9" />
        <path d="M12 3v6" />
      </svg>
      <h1>Meal Plan Stan</h1>
    </div>

    <!-- Cart Queue Section -->
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/>
        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
      </svg>
      Walmart Cart
    </div>

    <button id="startMatch" class="btn btn-primary" disabled>
      1. Find Walmart Links
    </button>

    <div id="matchBar" class="progress-bar">
      <div id="matchFill" class="progress-fill"></div>
    </div>
    <div id="matchText" class="progress-text"></div>

    <div id="matchResults" class="results">
      <!-- Filled dynamically -->
    </div>

    <div id="matchStatus" class="status"></div>

    <button id="startCart" class="btn btn-cart" disabled>
      2. Add Shopping List to Cart
    </button>

    <div id="progressBar" class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <div id="progressText" class="progress-text"></div>

    <div id="cartResults" class="results">
      <!-- Filled dynamically -->
    </div>

    <div id="cartStatus" class="status"></div>

    <div class="divider"></div>

    <!-- Settings Section -->
    <div class="section-title">Settings</div>

    <label for="appUrl">App URL</label>
    <input id="appUrl" type="url" placeholder="https://your-app.railway.app" />

    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="Paste your API key from Settings" />

    <button id="save" class="btn btn-primary">Save Settings</button>

    <div id="status" class="status"></div>

    <p class="help">
      Get your API key from the Settings page in Meal Plan Stan.
      Visit any product page on walmart.ca to see the "Add to Pantry" button.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
