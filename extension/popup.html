<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #faf9f7;
        color: #1a1a1a;
        padding: 20px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e5e2dc;
      }
      .header h1 {
        font-size: 16px;
        font-weight: 700;
        color: #c4704b;
      }
      .header svg {
        width: 28px;
        height: 28px;
        color: #c4704b;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #666;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 12px;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus {
        border-color: #c4704b;
      }
      button {
        width: 100%;
        padding: 10px;
        background: linear-gradient(135deg, #c4704b 0%, #a85d3a 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button:hover {
        opacity: 0.9;
      }
      .status {
        margin-top: 10px;
        padding: 8px;
        border-radius: 6px;
        font-size: 12px;
        text-align: center;
        display: none;
      }
      .status.success {
        display: block;
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        display: block;
        background: #f8d7da;
        color: #721c24;
      }
      .help {
        margin-top: 12px;
        font-size: 11px;
        color: #999;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z" />
        <path d="m3 9 2.45-4.9A2 2 0 0 1 7.24 3h9.52a2 2 0 0 1 1.8 1.1L21 9" />
        <path d="M12 3v6" />
      </svg>
      <h1>Meal Plan Stan</h1>
    </div>

    <label for="appUrl">App URL</label>
    <input id="appUrl" type="url" placeholder="https://your-app.railway.app" />

    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="Paste your API key from Settings" />

    <button id="save">Save Settings</button>

    <div id="status" class="status"></div>

    <p class="help">
      Get your API key from the Settings page in Meal Plan Stan.
      Then visit any product page on walmart.ca to see the "Add to Pantry" button.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
